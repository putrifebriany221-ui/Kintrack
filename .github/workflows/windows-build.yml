name: Build Windows Installer (KINTRACK)

# Produces the real Windows installer (.exe) on a Windows runner and uploads it
# as a downloadable artifact. Run automatically on push, or manually from the
# GitHub "Actions" tab (Run workflow). Tagging v* also attaches the exe to a Release.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Backend the desktop app talks to (HTTPS). Change here to point at a
      # different/production server; the frontend reads this at build time.
      REACT_APP_BACKEND_URL: https://kpi-pengadilan.preview.emergentagent.com
      GENERATE_SOURCEMAP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: corepack enable

      - name: Build frontend (production React build)
        working-directory: frontend
        run: |
          yarn install --network-timeout 600000
          yarn build

      - name: Install desktop dependencies
        working-directory: desktop
        run: yarn install --network-timeout 600000

      - name: Build Windows installer + portable exe
        working-directory: desktop
        run: yarn dist:win

      - name: List output
        working-directory: desktop
        run: dir dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KINTRACK-Windows
          path: |
            desktop/dist/*Setup*.exe
            desktop/dist/*portable*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*Setup*.exe
            desktop/dist/*portable*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
