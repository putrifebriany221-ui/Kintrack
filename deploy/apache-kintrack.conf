# KINTRACK Apache vhost — serves React static build and reverse-proxies /api to FastAPI.
# Enable modules: a2enmod proxy proxy_http headers rewrite ssl
# Place React build at /opt/kintrack/frontend/build

<VirtualHost *:80>
    ServerName kinerja.pn-sukadana.go.id
    # Redirect all HTTP to HTTPS
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName kinerja.pn-sukadana.go.id

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/kinerja.crt
    SSLCertificateKeyFile   /etc/ssl/private/kinerja.key

    DocumentRoot /opt/kintrack/frontend/build

    # --- API -> FastAPI on loopback ---
    ProxyPreserveHost On
    ProxyPass        /api  http://127.0.0.1:8001/api
    ProxyPassReverse /api  http://127.0.0.1:8001/api

    # --- React SPA static files with client-side routing fallback ---
    <Directory /opt/kintrack/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Cache hashed static assets aggressively; never cache index.html
    <FilesMatch "\.(?:js|css|png|jpg|jpeg|svg|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  /var/log/apache2/kintrack_error.log
    CustomLog /var/log/apache2/kintrack_access.log combined
</VirtualHost>
